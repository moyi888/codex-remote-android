name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.2"
          cache-dependency-path: bridge/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Build Windows App
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          go build -ldflags "-H=windowsgui -X main.version=$version" -o "codex-remote-windows-$version.exe" ./cmd/codex-remote
          go build -ldflags "-X main.version=$version" -o "codex-remote-cli-windows-$version.exe" ./cmd/codex-remote
          ../scripts/verify-windows-executable.ps1 -Path "codex-remote-windows-$version.exe" -ExpectedSubsystem WindowsGui
          ../scripts/verify-windows-executable.ps1 -Path "codex-remote-cli-windows-$version.exe" -ExpectedSubsystem Console
      - uses: actions/upload-artifact@v7
        with:
          name: windows-app
          path: |
            bridge/codex-remote-windows-*.exe
            bridge/codex-remote-cli-windows-*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "codex-remote-android-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/codex-remote-android-*.apk
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bridge, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
